<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="290" viewBox="0 0 1200 290" role="img" aria-labelledby="title desc"><title id="title">Engineering architecture patterns</title><desc id="desc">A general software architecture pattern connecting a user interface to APIs and domain services, data stores, and optional AI or external integrations. Illustrative, not a deployment diagram.</desc><defs><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#526052" stroke-opacity=".16" stroke-width=".7"/></pattern></defs><rect width="1200" height="290" rx="14" fill="#0b100d"/><rect width="1200" height="290" rx="14" fill="url(#grid)"/><g font-family="monospace"><text x="30" y="37" fill="#d6ef70" font-size="12" letter-spacing="2">SYSTEM PATTERN / ILLUSTRATIVE ARCHITECTURE</text><text x="30" y="62" fill="#89958c" font-size="11">A reusable application boundary model — not a diagram of one deployed system</text><rect x="42" y="103" width="215" height="110" rx="9" fill="#111812" stroke="#59634f"/><text x="62" y="140" fill="#e7ece5" font-size="14">PRESENTATION</text><text x="62" y="169" fill="#a8b1a9" font-size="12">WEB / CLIENT UI</text><path d="M267 158h62" stroke="#d6ef70" stroke-width="2"/><path d="m320 151 10 7-10 7" fill="none" stroke="#d6ef70" stroke-width="2"/><rect x="342" y="103" width="215" height="110" rx="9" fill="#111812" stroke="#59634f"/><text x="362" y="140" fill="#e7ece5" font-size="14">API BOUNDARY</text><text x="362" y="169" fill="#a8b1a9" font-size="12">AUTH / VALIDATION</text><path d="M567 158h62" stroke="#d6ef70" stroke-width="2"/><path d="m620 151 10 7-10 7" fill="none" stroke="#d6ef70" stroke-width="2"/><rect x="642" y="103" width="215" height="110" rx="9" fill="#111812" stroke="#59634f"/><text x="662" y="140" fill="#e7ece5" font-size="14">DOMAIN SERVICES</text><text x="662" y="169" fill="#a8b1a9" font-size="12">RULES / WORKFLOWS</text><path d="M867 158h48" stroke="#d6ef70" stroke-width="2"/><path d="m906 151 10 7-10 7" fill="none" stroke="#d6ef70" stroke-width="2"/><rect x="928" y="103" width="225" height="110" rx="9" fill="#141321" stroke="#7868be"/><text x="948" y="140" fill="#e6e3f6" font-size="14">ADAPTERS</text><text x="948" y="169" fill="#b9abff" font-size="12">DATA / AI / EXTERNAL</text><text x="42" y="250" fill="#89958c" font-size="11">CLEAR BOUNDARIES / TESTABLE LOGIC / EXPLICIT EXTERNAL DEPENDENCIES</text></g></svg>