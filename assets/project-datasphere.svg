<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="270" viewBox="0 0 1200 270" role="img" aria-labelledby="title desc"><title id="title">DataSphere</title><desc id="desc">DataSphere browser-local analytics workspace showing imported data, profiling metrics, transformations, and visualizations.</desc><defs><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#526052" stroke-opacity=".18" stroke-width=".7"/></pattern></defs><rect width="1200" height="270" rx="14" fill="#0b100d"/><rect width="1200" height="270" rx="14" fill="url(#grid)"/><g font-family="monospace"><text x="32" y="39" fill="#85d8e7" font-size="12" letter-spacing="2">PROJECT / DATASPHERE · BROWSER-LOCAL ANALYTICS</text><text x="32" y="83" fill="#edf0e9" font-size="24">Explore data without uploading it.</text><text x="32" y="114" fill="#9ba49c" font-size="14">CSV / JSON · profiling · transformations · interactive charts</text><text x="32" y="220" fill="#89958c" font-size="12">LOCAL PERSISTENCE / INDEXEDDB · NO SERVER</text><rect x="700" y="62" width="470" height="143" rx="9" fill="#111812" stroke="#465c62"/><text x="719" y="88" fill="#85d8e7" font-size="11">WORKSPACE / DATASET PROFILE</text><path d="M719 102h430" stroke="#344248"/><g fill="#a8b1a9"><rect x="720" y="119" width="90" height="8" rx="2"/><rect x="720" y="139" width="150" height="8" rx="2"/><rect x="720" y="159" width="115" height="8" rx="2"/></g><path d="M902 177V127m0 50h232" stroke="#59666a"/><path d="m914 165 37-21 37 10 37-38 37 16 39-32 30 18" fill="none" stroke="#85d8e7" stroke-width="3"/><circle cx="1055" cy="116" r="4" fill="#d6ef70"/><circle cx="1094" cy="134" r="4" fill="#d6ef70"/></g></svg>